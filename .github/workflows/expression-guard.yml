name: Expression runtime guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-expression-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_expression_snapshot.py
      - run: python -m py_compile robot_face_v11_fc245e4.py bluebot_integration.py
      - run: python -m pip install pygame==2.6.1
      - run: SDL_VIDEODRIVER=dummy python -m unittest discover -s tests -p 'test_expression_integration.py'
